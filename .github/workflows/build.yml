name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      max-parallel:
        description: Concurrent build jobs for the CI pilot
        type: number
        default: 8
      strict-gradle-cache:
        description: Restore Gradle home only from the same build job
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: iamkaf/multiloader-conventions/.github/workflows/mod-build.yml@c04ba0b9b350143f6074a3da4a470dbdefff07cc
    with:
      max-parallel: ${{ inputs.max-parallel || 8 }}
      strict-gradle-cache: ${{ inputs.strict-gradle-cache || false }}
      cache-diagnostics-job: 26.2-neoforge
